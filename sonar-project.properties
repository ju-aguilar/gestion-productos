sonar.projectKey=ju-aguilar_gestion-productos
sonar.organization=ju-aguilar-gestion-productos
sonar.projectName=ju-aguilar_gestion-productos
sonar.projectVersion=1.0

# Le decimos que el código fuente está en la raíz, PERO excluimos la carpeta tests
sonar.sources=.
sonar.exclusions=**/__pycache__/**,.github/**,coverage.xml,**/tests/**

# Le decimos que las pruebas están SOLO en la carpeta tests
sonar.tests=tests

sonar.python.coverage.reportPaths=coverage.xml
sonar.host.url=https://sonarcloud.io